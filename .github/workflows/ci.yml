name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Ruff guardrail
        run: |
          ruff check \
            scripts/check_utf8.py \
            tests/test_architecture_boundaries.py \
            tests/test_app_config.py \
            tests/test_workspace_quote_codes.py \
            tests/test_kline_open_service.py \
            app/services/kline_open_service.py \
            core/app_config.py \
            infra/settings \
            ui/main_window_qt.py \
            ui/workspaces/classic_workspace.py \
            ui/workspaces/workspace_facade.py \
            ui/workspaces/quote_universe_service.py
          ruff format --check scripts/check_utf8.py
      - name: UTF-8 guardrail
        run: python scripts/check_utf8.py
      - name: Architecture regression suite
        run: |
          pytest \
            tests/test_architecture_boundaries.py \
            tests/test_app_config.py \
            tests/test_application_bootstrap.py \
            tests/test_domain_entrypoints.py \
            tests/test_event_bus_layers.py \
            tests/test_log_tab.py \
            tests/test_market_data_ports.py \
            tests/test_main_window_f5_done.py \
            tests/test_main_window_network.py \
            tests/test_workspace_quote_codes.py \
            tests/test_kline_open_service.py \
            tests/test_main_window_shell.py \
            tests/test_observability.py \
            tests/test_service_toggle_registry.py \
            tests/test_startup_orchestrator.py \
            -q
      - name: Service regression suite
        run: |
          pytest \
            tests/test_provider_services.py \
            tests/test_engine_services.py \
            tests/test_background_job_runner.py \
            tests/test_task_manager.py \
            -q
      - name: Runtime dependency guardrail
        run: |
          pytest \
            tests/test_runtime_env.py \
            tests/test_runtime_env_self_check.py \
            tests/test_yf_session.py \
            -q
      - name: Performance and runtime guardrail
        run: |
          pytest \
            tests/test_perf_probe_scripts.py \
            tests/test_perf_budget_check.py \
            tests/test_runtime_health.py \
            tests/test_tab_data_lineage_service.py \
            tests/test_market_data_warehouse_manifest.py \
            tests/test_market_data_warehouse.py \
            tests/test_kline_webengine_lifecycle_smoke.py \
            tests/test_qt_webengine_preflight.py \
            -q
      - name: Project audit command contract
        run: python scripts/project_audit.py --quick --list

  windows-smoke:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Project audit command contract
        run: python scripts/project_audit.py --quick --list
      - name: Windows architecture and runtime smoke
        run: |
          python -m pytest -q tests/test_architecture_boundaries.py tests/test_runtime_env_self_check.py tests/test_project_audit.py
