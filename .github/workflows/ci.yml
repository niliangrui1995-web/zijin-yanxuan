name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 0"

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  VCP_COMPLEXITY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}

jobs:
  python314-audit-smoke:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14.5"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -c constraints-py314-linux.txt
      - name: Project audit command contract
        run: python scripts/project_audit.py --quick --skip-webengine-preflight --skip-ruff --keep-going

  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14.5"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -c constraints-py314-linux.txt
      - name: Ruff guardrail
        id: ruff_guardrail
        continue-on-error: true
        run: |
          ruff check \
            scripts/check_utf8.py \
            tests/test_architecture_boundaries.py \
            tests/test_app_config.py \
            tests/test_asian_market_tab.py \
            tests/test_asian_market_workers.py \
            tests/test_workspace_quote_codes.py \
            tests/test_kline_open_service.py \
            app/services/kline_open_service.py \
            core/app_config.py \
            infra/settings \
            ui/services/asian_market_runtime_service.py \
            ui/main_window_qt.py \
            ui/tabs/asian_market_tab.py \
            ui/tabs/asian_market_workers.py \
            ui/workspaces/classic_workspace.py \
            ui/workspaces/workspace_facade.py \
            ui/workspaces/quote_universe_service.py
          ruff format --check scripts/check_utf8.py
      - name: Root entrypoint guardrail
        id: root_entrypoint
        continue-on-error: true
        run: |
          ruff check vcp_hunter_qt.pyw
          python -m py_compile vcp_hunter_qt.pyw
      - name: UTF-8 guardrail
        id: utf8_guardrail
        continue-on-error: true
        run: python scripts/check_utf8.py
      - name: Architecture regression suite
        id: architecture_regression
        continue-on-error: true
        run: |
          pytest \
            tests/test_architecture_boundaries.py \
            tests/test_app_config.py \
            tests/test_application_bootstrap.py \
            tests/test_domain_entrypoints.py \
            tests/test_event_bus_layers.py \
            tests/test_log_tab.py \
            tests/test_market_data_ports.py \
            tests/test_main_window_f5_done.py \
            tests/test_main_window_network.py \
            tests/test_workspace_quote_codes.py \
            tests/test_kline_open_service.py \
            tests/test_main_window_shell.py \
            tests/test_observability.py \
            tests/test_service_toggle_registry.py \
            tests/test_startup_orchestrator.py \
            -q
      - name: Service regression suite
        id: service_regression
        continue-on-error: true
        run: |
          pytest \
            tests/test_central_quote_polling_service.py \
            tests/test_central_quotes_worker.py \
            tests/test_earnings_scheduler_startup.py \
            tests/test_earnings_tab_trade_window.py \
            tests/test_provider_services.py \
            tests/test_engine_services.py \
            tests/test_background_job_runner.py \
            tests/test_task_manager.py \
            -q
      - name: Runtime dependency guardrail
        id: runtime_dependency
        continue-on-error: true
        run: |
          pytest \
            tests/test_runtime_env.py \
            tests/test_runtime_env_self_check.py \
            tests/test_yf_session.py \
            -q
      - name: Performance and runtime guardrail
        id: performance_runtime
        continue-on-error: true
        run: |
          pytest \
            tests/test_perf_probe_scripts.py \
            tests/test_perf_budget_check.py \
            tests/test_runtime_health.py \
            tests/test_tab_data_lineage_service.py \
            tests/test_lhb_tab.py \
            tests/test_fund_holdings_tab.py \
            tests/test_market_data_warehouse_manifest.py \
            tests/test_market_data_warehouse.py \
            tests/test_kline_webengine_lifecycle_smoke.py \
            tests/test_qt_webengine_preflight.py \
            -q
      - name: Full regression suite with coverage budgets
        id: full_regression
        continue-on-error: true
        run: |
          set +e
          python -m pytest -q --cov-branch --cov=app --cov=core --cov=domains --cov=infra --cov=ui --cov=vcp --cov-report=term-missing --cov-report=json:tmp/coverage.json --cov-fail-under=90
          pytest_status=$?
          python scripts/coverage_budget_check.py --input tmp/coverage.json
          budget_status=$?
          if [ "$pytest_status" -ne 0 ] || [ "$budget_status" -ne 0 ]; then
            exit 1
          fi
      - name: Project audit command contract
        id: project_audit
        continue-on-error: true
        run: python scripts/project_audit.py --quick --skip-webengine-preflight --type-check --keep-going
      - name: Fail if any test gate failed
        if: always()
        env:
          RUFF_OUTCOME: ${{ steps.ruff_guardrail.outcome }}
          ROOT_OUTCOME: ${{ steps.root_entrypoint.outcome }}
          UTF8_OUTCOME: ${{ steps.utf8_guardrail.outcome }}
          ARCH_OUTCOME: ${{ steps.architecture_regression.outcome }}
          SERVICE_OUTCOME: ${{ steps.service_regression.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime_dependency.outcome }}
          PERFORMANCE_OUTCOME: ${{ steps.performance_runtime.outcome }}
          FULL_OUTCOME: ${{ steps.full_regression.outcome }}
          AUDIT_OUTCOME: ${{ steps.project_audit.outcome }}
        run: |
          failed=0
          for result in \
            "ruff=$RUFF_OUTCOME" \
            "root=$ROOT_OUTCOME" \
            "utf8=$UTF8_OUTCOME" \
            "architecture=$ARCH_OUTCOME" \
            "service=$SERVICE_OUTCOME" \
            "runtime=$RUNTIME_OUTCOME" \
            "performance=$PERFORMANCE_OUTCOME" \
            "full=$FULL_OUTCOME" \
            "audit=$AUDIT_OUTCOME"
          do
            echo "$result"
            if [ "${result#*=}" != "success" ]; then
              failed=1
            fi
          done
          exit "$failed"

  windows-smoke:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14.5"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -c constraints-py314-windows.txt
      - name: Project audit command contract
        id: windows_audit
        continue-on-error: true
        run: python scripts/project_audit.py --quick --skip-webengine-preflight --keep-going
      - name: Windows architecture and runtime smoke
        id: windows_runtime_smoke
        continue-on-error: true
        run: |
          python -m pytest -q tests/test_architecture_boundaries.py tests/test_runtime_env_self_check.py tests/test_project_audit.py
      - name: Fail if any Windows gate failed
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.windows_audit.outcome }}
          SMOKE_OUTCOME: ${{ steps.windows_runtime_smoke.outcome }}
        run: |
          $failed = $false
          foreach ($result in @("audit=$env:AUDIT_OUTCOME", "runtime-smoke=$env:SMOKE_OUTCOME")) {
            Write-Host $result
            if (-not $result.EndsWith("=success")) {
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

  extended-audit:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14.5"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -c constraints-py314-linux.txt
      - name: Extended quality audit
        run: |
          python scripts/project_audit.py --quick --skip-runtime-self-check --skip-webengine-preflight --extended-ruff --type-check --dependency-audit --runtime-health-short --keep-going

  latest-allowed-canary:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14.5"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
      - name: Resolve latest allowed dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Latest allowed dependency canary
        run: python scripts/project_audit.py --quick --skip-runtime-self-check --skip-webengine-preflight --type-check --keep-going
