[tool.ruff]
target-version = "py314"
line-length = 120
extend-include = ["*.pyw"]
exclude = [
  "build",
  "dist",
  "data",
  "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
  "E501",
  "E402",
  "E701",
  "E702",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.coverage.run]
core = "pytrace"
